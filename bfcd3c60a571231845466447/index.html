<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: mediastream:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>CQ 解码器</title>
<style>
:root {
  --bg: #f2f3f6; --panel: #ffffff; --ink: #15171c; --muted: #616977; --line: #d9dde4;
  --accent: #1f5eff; --accent-ink: #ffffff; --ok: #137a3f; --ok-bg: #e7f6ec;
  --warn: #8a5a00; --warn-bg: #fff4dc; --err: #b42318; --err-bg: #fdecea; --code-bg: #fbfbfc;
  --mono: ui-monospace, Menlo, SFMono-Regular, Consolas, monospace;
  --sans: -apple-system, system-ui, "PingFang SC", "Hiragino Sans", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --panel: #16181d; --ink: #eceef3; --muted: #9aa2b1; --line: #2b2f37;
    --accent: #6f95ff; --accent-ink: #06080c; --ok: #6fd69a; --ok-bg: #11301e;
    --warn: #f3c56b; --warn-bg: #33270e; --err: #ff8a80; --err-bg: #3a1714; --code-bg: #0e1014;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; }
.wrap { max-width: 760px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px)); }
h1 { font-size: 20px; margin: 4px 0 2px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
textarea { display: block; width: 100%; font-family: var(--mono); font-size: 16px; color: var(--ink); background: var(--code-bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px; -webkit-appearance: none; appearance: none; }
#input { height: 9.5em; word-break: break-all; resize: vertical; }
#output { height: 55vh; min-height: 260px; white-space: pre; overflow: auto; tab-size: 4; -moz-tab-size: 4; font-size: 13px; line-height: 1.5; resize: vertical; }
#output.wrapped { white-space: pre-wrap; word-break: break-all; }
.btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
button { font: inherit; font-size: 16px; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 16px; flex: 1 1 0; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; flex: 2 1 0; }
button:active { opacity: .7; }
.hidden { display: none !important; }
.msg { border-radius: 9px; padding: 10px 12px; font-size: 14.5px; line-height: 1.5; margin-top: 10px; white-space: pre-line; word-break: break-word; }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.warn { background: var(--warn-bg); color: var(--warn); }
.msg.err { background: var(--err-bg); color: var(--err); font-weight: 600; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 10px; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; font-family: var(--mono); font-size: 13.5px; word-break: break-all; }
.namerow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.namerow label { color: var(--muted); font-size: 14px; white-space: nowrap; }
#fname { flex: 1; min-width: 0; font: inherit; font-family: var(--mono); font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--code-bg); color: var(--ink); -webkit-appearance: none; appearance: none; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.foot { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.cam { position: relative; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
.cam video { display: block; width: 100%; max-height: 62vh; object-fit: cover; }
.cam .frame { position: absolute; left: 50%; top: 50%; width: 60%; height: 60%; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.85); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,.25); pointer-events: none; }
.cam .camstat { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; text-align: center; }
.cam.hit .frame { border-color: #4ade80; }
.progress { margin-top: 10px; }
.progress .ptitle { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 6px; }
.progress .ptitle button { min-height: 34px; flex: 0 0 auto; font-size: 14px; padding: 0 12px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 4px; }
.cells span { height: 28px; border-radius: 5px; background: var(--line); color: var(--muted); font: 600 11px/28px var(--mono); text-align: center; }
.cells span.got { background: var(--ok); color: var(--panel); }
input.file { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>源码解码器</h1>
  <div class="sub">协议 CQ1 · 完全离线 · 粘贴后自动解码</div>

  <div class="card">
    <textarea id="input" placeholder="在此粘贴识别得到的文本（以 CQ1- 或 CQ1M- 开头，多张可一次粘贴）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="btns">
      <button class="primary" id="btnDecode" type="button">解码</button>
      <button id="btnPaste" type="button" class="hidden">粘贴</button>
      <button id="btnClear" type="button">清空</button>
    </div>
    <div class="btns">
      <button id="btnCamera" type="button">相机识别</button>
      <button id="btnPhoto" type="button">拍照 / 选图</button>
      <input type="file" id="photoInput" class="file" accept="image/*" multiple>
    </div>
    <div class="cam hidden" id="cam">
      <video id="video" playsinline muted autoplay></video>
      <div class="frame" id="camFrame"></div>
      <div class="camstat" id="camStat">正在启动相机…</div>
    </div>
    <div class="btns hidden" id="camBtns">
      <button id="btnCamStop" type="button">关闭相机</button>
      <button id="btnTorch" type="button" class="hidden">补光</button>
    </div>
    <div class="progress hidden" id="progress">
      <div class="ptitle"><span id="progText"></span><button id="btnReset" type="button">重新收集</button></div>
      <div class="cells" id="cells"></div>
    </div>
    <div id="msg" class="msg hidden" role="status" aria-live="polite"></div>
  </div>

  <div class="card hidden" id="result">
    <div class="namerow">
      <label for="fname">文件名</label>
      <input type="text" id="fname" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <dl>
      <dt>大小</dt><dd id="rBytes"></dd>
      <dt>字符 / 行</dt><dd id="rChars"></dd>
      <dt>换行符</dt><dd id="rEol"></dd>
      <dt>CRC32</dt><dd id="rCrc"></dd>
    </dl>
    <textarea id="output" readonly wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    <label class="toggle"><input type="checkbox" id="wrapToggle"> 自动换行显示（不影响复制和保存的内容）</label>
    <div class="btns">
      <button class="primary" id="btnCopy" type="button">复制全部</button>
      <button id="btnSave" type="button">保存文件</button>
      <button id="btnShare" type="button" class="hidden">分享…</button>
    </div>
    <div id="msg2" class="msg hidden" role="status" aria-live="polite"></div>
  </div>

  <div class="foot">
    使用方法：① 点“相机识别”对准电脑屏幕，多张时电脑端开启自动轮播，收齐后自动解码；② 不能用相机时点“拍照 / 选图”，可一次选多张图片；③ 或用“快捷指令”识别后拷贝文本，粘贴到输入框（多张可逐张粘贴，也可一次粘贴）。<br>
    “保存文件”输出的内容与原文件逐字节一致；如果当前 App 不支持下载，请用“复制全部”，或在结果框中长按 → 全选 → 拷贝。
  </div>
</div>
